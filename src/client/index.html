    <meta name="title" content="Expense Exchange" />
    <meta name="description" content="Tool to keep track of expenses for multiple people" />

    <!-- Google / Search Engine Tags -->
    <meta itemprop="name" content="Expense Exchange" />
    <meta itemprop="description" content="Tool to keep track of expenses for multiple people" />
    <meta
      itemprop="image"
      content="https://deniszholob.github.io/expense-exchange/assets/expense-exchange-splash.png"
    />

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://deniszholob.github.io/expense-exchange/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Expense Exchange" />
    <meta property="og:description" content="Tool to keep track of expenses for multiple people" />
    <meta
      property="og:image"
      content="https://deniszholob.github.io/expense-exchange/assets/expense-exchange-splash.png"
    />
    <meta property="og:author" content="Denis Zholob" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Expense Exchange" />
    <meta name="twitter:description" content="Tool to keep track of expenses for multiple people" />
    <meta
      name="twitter:image"
      content="https://deniszholob.github.io/expense-exchange/assets/expense-exchange-splash.png"
    />

    <meta name="twitter:creator" content="@deniszholob" />

    <!-- Title/Icon -->
    <title>Expense Exchange</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="assets/expense-exchange-splash.png" />

    <!-- Bootstrap -->
    <!-- <link rel="stylesheet" href="//stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"> -->

    <!-- Fonts -->
    <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css?"> -->
    <!-- Stylesheets -->
    <style>
      .app-loading-screen {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: 24px;
        color: var(--color-finance-text, #f1f3f2);
        background:
          radial-gradient(
            ellipse at 50% 0%,
            color-mix(in srgb, var(--color-finance-accent, #83b487) 10%, transparent),
            transparent 58%
          ),
          var(--color-finance-canvas, #15191b);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .app-loading-panel {
        box-sizing: border-box;
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid color-mix(in srgb, var(--color-finance-border, #3c4547) 75%, transparent);
        border-radius: 14px;
        background: linear-gradient(
          150deg,
          var(--color-finance-surface-highlight, #242a2c),
          var(--color-finance-surface, #1d2224) 55%,
          var(--color-finance-surface-lowlight, #1a1f21)
        );
        box-shadow: 0 24px 64px rgb(0 0 0 / 24%);
        text-align: center;
      }
      .app-loading-mark {
        display: grid;
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--color-finance-accent, #83b487) 30%, transparent);
        border-radius: 14px;
        background: color-mix(
          in srgb,
          var(--color-finance-accent, #83b487) 12%,
          var(--color-finance-raised, #242a2c)
        );
      }
      .app-loading-mark img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }
      .app-loading-title {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      .app-loading-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 18px 0 0;
        color: var(--color-finance-accent-text, #acdbaf);
        font-size: 0.95rem;
        font-weight: 500;
      }
      .app-loading-spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid color-mix(in srgb, var(--color-finance-accent, #83b487) 22%, transparent);
        border-top-color: var(--color-finance-accent-hover, #9bcb9e);
        border-radius: 9999px;
        animation: app-spin 0.9s linear infinite;
        flex: 0 0 auto;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .app-loading-help {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid
          color-mix(in srgb, var(--color-finance-border, #3c4547) 58%, transparent);
        color: var(--color-finance-secondary, #b0b9b7);
        font-size: 0.82rem;
        line-height: 1.6;
      }
      .app-loading-help p {
        margin: 0;
      }
      .app-loading-help a {
        color: var(--color-finance-accent-text, #acdbaf);
        text-decoration: underline;
        text-decoration-color: color-mix(
          in srgb,
          var(--color-finance-accent, #83b487) 55%,
          transparent
        );
        text-underline-offset: 3px;
      }
      .app-loading-build {
        display: inline-flex;
        gap: 6px;
        margin: 20px 0 0;
        padding: 5px 9px;
        border: 1px solid color-mix(in srgb, var(--color-finance-border, #3c4547) 55%, transparent);
        border-radius: 9999px;
        color: var(--color-finance-muted, #8d9996);
        font-size: 0.7rem;
        font-variant-numeric: tabular-nums;
      }
      .app-loading-build strong {
        color: var(--color-finance-secondary, #b0b9b7);
        font-weight: 500;
      }
      @media (max-width: 480px) {
        .app-loading-panel {
          padding: 28px 22px;
        }
      }
    </style>
  </head>

  <body>
    <app-root>
      <div class="app-loading-screen" aria-busy="true">
        <section class="app-loading-panel" aria-labelledby="app-loading-title">
          <div class="app-loading-mark" aria-hidden="true">
            <img src="assets/expense-exchange-icon.png" alt="" width="32" height="32" />
          </div>
          <h1 class="app-loading-title" id="app-loading-title">Expense Exchange</h1>
          <p class="app-loading-status" role="status">
            <span class="app-loading-spinner" aria-hidden="true"></span>
            Loading your workspace…
          </p>
          <div class="app-loading-help">
            <p>If this takes longer than expected, there may be a problem.</p>
            <p>
              Open the Debug console with <strong>F12</strong> and
              <a
                href="https://github.com/deniszholob/expense-exchange/issues"
                target="_blank"
                rel="noopener"
                >report any errors</a
              >.
            </p>
          </div>
          <p class="app-loading-build">
            <strong>Build</strong>
            <span>{{BUILD_VERSION}} · {{BUILD_DATE}}</span>
          </p>
        </section>
      </div>
    </app-root>

    <noscript> Please enable JavaScript to continue using this application. </noscript>
  </body>
</html>
