<!doctype html>
<!--
  Initializing with dark class so tailwind knowns to bring in dark mode classes if used.
  Toggle class via code to switch modes.
-->
<html class="dark" lang="en">
  <head>
    <!-- Meta Data -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Denis Zholob" />
    <meta name="application-build" content="development" />
    <meta name="keywords" content="Denis, Zholob, Finance" />
    <meta name="title" content="Expense Exchange" />
    <meta name="description" content="Tool to keep track of expenses for multiple people" />

    <!-- Google / Search Engine Tags -->
    <meta itemprop="name" content="Expense Exchange" />
    <meta itemprop="description" content="Tool to keep track of expenses for multiple people" />
    <meta
      itemprop="image"
      content="https://deniszholob.github.io/expense-exchange/assets/expense-exchange-splash.png"
    />

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://deniszholob.github.io/expense-exchange/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Expense Exchange" />
    <meta property="og:description" content="Tool to keep track of expenses for multiple people" />
    <meta
      property="og:image"
      content="https://deniszholob.github.io/expense-exchange/assets/expense-exchange-splash.png"
    />
    <meta property="og:author" content="Denis Zholob" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Expense Exchange" />
    <meta name="twitter:description" content="Tool to keep track of expenses for multiple people" />
    <meta
      name="twitter:image"
      content="https://deniszholob.github.io/expense-exchange/assets/expense-exchange-splash.png"
    />
    <meta name="twitter:site" content="@deniszholob" />
    <meta name="twitter:creator" content="@deniszholob" />

    <!-- Title/Icon -->
    <title>Expense Exchange</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="assets/expense-exchange-splash.png" />
    <link rel="mask-icon" href="safari-pinned-tab.svg" color="#0b1220" />
    <meta name="msapplication-TileColor" content="#0b1220" />
    <base href="/" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b1220" />

    <!-- Meta Tags Generated via http://heymeta.com -->

    <!-- Prefetch/Preconnect -->
    <!-- <link rel="dns-prefetch" href="https://fonts.googleapis.com"> -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous"> -->
    <!-- <link rel="dns-prefetch" href="https://fonts.gstatic.com/s/"> -->
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com/s/" crossorigin="anonymous"> -->

    <!-- Bootstrap -->
    <!-- <link rel="stylesheet" href="//stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"> -->

    <!-- Fonts -->
    <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css?"> -->
    <!-- Stylesheets -->
    <style>
      .app-loading-spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        margin-right: 6px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-top-color: rgba(255, 255, 255, 0.9);
        border-radius: 9999px;
        animation: app-spin 0.9s linear infinite;
        vertical-align: text-bottom;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <app-root>
      <div style="text-align: center; padding-top: 20px">
        <span class="app-loading-spinner" aria-hidden="true"></span>
        Loading...

        <p>
          If this is loading forever, there may be a bug.
          <br />
          Hit <strong>F12</strong> to bring up the Debug console, and
          <a
            href="https://github.com/deniszholob/expense-exchange/issues"
            target="_blank"
            rel="noopener"
          >
            report
          </a>
          any errors.
        </p>
        <br />
        <p class="text-muted">
          <span>
            <strong>Build: </strong>
            {{BUILD_VERSION}} - {{BUILD_DATE}}
          </span>
        </p>
      </div>
    </app-root>

    <noscript> Please enable JavaScript to continue using this application. </noscript>
  </body>
</html>
