<div class="flex h-dvh min-h-0 flex-col overflow-hidden">
  <app-header></app-header>
  @if (recurringState.$popupOpen()) {
    <aside
      class="surface-card recurring-toast fixed right-4 bottom-16 z-50 flex max-h-[calc(100dvh-5rem)] w-[min(26rem,calc(100vw-2rem))] flex-col overflow-hidden border p-4"
      role="status"
      aria-live="polite"
    >
      <div class="flex min-h-0 flex-1 flex-col overflow-hidden">
        <div class="recurring-toast-divider flex shrink-0 items-center gap-3 border-b pb-3">
          <span class="status-icon-warning size-9">
            <svg class="size-5" lucideBell aria-hidden="true"></svg>
          </span>
          <div class="min-w-0 flex-1">
            <p class="font-semibold">Recurring items need attention</p>
          </div>
          <button
            class="btn-clear toast-dismiss-button shrink-0"
            (click)="recurringState.dismissPopup()"
            type="button"
            aria-label="Dismiss recurring notification"
          >
            <svg class="size-5" lucideX aria-hidden="true"></svg>
          </button>
        </div>
        <ul class="text-finance-muted mt-3 min-h-0 flex-1 space-y-1 overflow-y-auto pr-1 text-sm">
          @for (item of recurringState.$popupItems(); track item.ruleId) {
            <li class="flex items-center justify-between gap-3 py-0.5">
              <span class="min-w-0 truncate">{{ item.name }}</span>
              <span class="status-badge status-badge-warning shrink-0">
                {{ item.count }} {{ item.count === 1 ? 'occurrence' : 'occurrences' }}
              </span>
            </li>
          }
        </ul>
        <div class="recurring-toast-divider mt-3 shrink-0 border-t pt-3">
          <a
            class="link inline-flex text-sm font-semibold"
            [routerLink]="['/', PageRoute.Recurring]"
            (click)="recurringState.dismissPopup()"
          >
            Review recurring items
          </a>
        </div>
      </div>
    </aside>
  }
  <main class="min-h-0 flex-1 overflow-y-auto py-4 sm:py-6">
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
</div>
