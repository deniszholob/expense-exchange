<button
  class="px-3"
  [class.header-control-active]="$expanded()"
  [class.text-finance-muted]="!$expanded()"
  [class.hover:bg-finance-raised]="!$expanded()"
  [class.hover:text-finance-text]="!$expanded()"
  [attr.aria-expanded]="$expanded()"
  [attr.aria-label]="'Select data range, currently ' + $label()"
  [attr.aria-controls]="$panelId()"
  (click)="toggleRequested.emit()"
  type="button"
>
  <svg class="size-4" lucideCalendarDays aria-hidden="true"></svg>
  {{ $label() }}
</button>
