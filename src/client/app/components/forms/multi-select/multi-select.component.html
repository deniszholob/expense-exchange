<fieldset
  class="rounded-control border-finance-border-strong bg-finance-raised focus-within:border-finance-accent focus-within:ring-finance-accent/30 flex w-full flex-col gap-2 border px-3 py-2.5 pr-10 focus-within:ring-2"
>
  <legend class="sr-only">Choose one or more options</legend>
  @for (option of $options(); track option.id) {
    <label class="text-finance-text flex items-center gap-2 text-sm">
      <input
        [checked]="value().includes(option.id)"
        (change)="toggle(option.id, $event)"
        type="checkbox"
      />
      {{ option.name }}
    </label>
  } @empty {
    <span class="text-finance-muted text-sm">No options available.</span>
  }
</fieldset>
