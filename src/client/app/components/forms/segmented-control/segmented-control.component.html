<div
  class="bg-finance-raised border-finance-border rounded-control max-w-full gap-1 border p-1"
  [class.flex]="$stretch()"
  [class.inline-flex]="!$stretch()"
  [class.w-full]="$stretch()"
  [class.w-fit]="!$stretch()"
  [attr.aria-label]="$label()"
  role="group"
>
  @for (option of $options(); track option.value) {
    <button
      class="rounded-control focus-visible:ring-finance-accent min-h-8 px-3 py-1.5 text-sm font-medium transition-colors focus-visible:ring-2 focus-visible:outline-none"
      [class.flex-1]="$stretch()"
      [class.text-center]="$stretch()"
      [class.bg-finance-accent/15]="value() === option.value"
      [class.text-finance-accent-hover]="value() === option.value"
      [class.text-finance-muted]="value() !== option.value"
      [class.hover:bg-finance-hover]="value() !== option.value"
      [disabled]="option.disabled ?? false"
      [attr.aria-pressed]="value() === option.value"
      (click)="value.set(option.value)"
      type="button"
    >
      {{ option.label }}
    </button>
  }
</div>
