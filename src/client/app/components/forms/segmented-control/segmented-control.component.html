<div
  class="bg-finance-raised border-finance-border rounded-control max-w-full gap-1 border p-1"
  [class.flex]="$stretch()"
  [class.inline-flex]="!$stretch()"
  [class.w-full]="$stretch()"
  [class.w-fit]="!$stretch()"
  [attr.aria-label]="$label()"
  role="group"
>
  @for (option of $options(); track option.value) {
    <button
      class="segmented-control-option focus-visible:ring-finance-accent min-h-8 px-3 py-1.5 text-sm focus-visible:ring-2 focus-visible:outline-none"
      [class.flex-1]="$stretch()"
      [class.text-center]="$stretch()"
      [class.segmented-control-option--active]="value() === option.value"
      [class.segmented-control-option--accent]="
        value() === option.value &&
        (option.tone === undefined || option.tone === SegmentedControlTone.Accent)
      "
      [class.text-finance-muted]="value() !== option.value"
      [class.hover:bg-finance-hover]="value() !== option.value"
      [class.segmented-control-option--negative]="
        value() === option.value && option.tone === SegmentedControlTone.Negative
      "
      [class.segmented-control-option--positive]="
        value() === option.value && option.tone === SegmentedControlTone.Positive
      "
      [class.segmented-control-option--warning]="
        value() === option.value && option.tone === SegmentedControlTone.Warning
      "
      [disabled]="option.disabled ?? false"
      [attr.aria-pressed]="value() === option.value"
      (click)="value.set(option.value)"
      type="button"
    >
      {{ option.label }}
    </button>
  }
</div>
