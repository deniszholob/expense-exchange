<div class="flex w-full flex-col gap-2">
  <label class="text-finance-text text-sm font-medium" [for]="$id()">
    {{ $label() }}
    @if ($required()) {
      <span class="text-finance-negative" aria-hidden="true">*</span>
    }
    @if ($required()) {
      <span class="sr-only"> (required)</span>
    }
  </label>
  <div class="form-field-control relative w-full">
    <ng-content></ng-content>
    @if ($passwordInput()) {
      <button
        class="form-field-password-toggle text-finance-muted rounded-control hover:bg-finance-hover hover:text-finance-text absolute top-2 left-2 grid size-6 min-h-0 place-items-center p-1 transition-colors focus-visible:ring-2 focus-visible:ring-sky-400"
        [attr.aria-label]="$passwordVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="$passwordVisible()"
        (click)="togglePasswordVisibility()"
        type="button"
      >
        @if ($passwordVisible()) {
          <svg class="size-4" lucideEye aria-hidden="true"></svg>
        } @else {
          <svg class="size-4" lucideEyeOff aria-hidden="true"></svg>
        }
      </button>
    }
    @if ($clearable() && $hasValue()) {
      <button
        class="btn-clear form-field-clear-button absolute top-2"
        [attr.aria-label]="'Clear ' + $label()"
        (click)="clearValue()"
        type="button"
      >
        <svg class="size-4" lucideX aria-hidden="true"></svg>
      </button>
    }
  </div>
</div>
