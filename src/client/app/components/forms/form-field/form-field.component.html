<div class="flex w-full flex-col gap-2">
  <label class="text-finance-text text-sm font-medium" [for]="$id()">
    {{ $label() }}
    @if ($required()) {
      <span class="text-finance-negative" aria-hidden="true">*</span>
    }
    @if ($required()) {
      <span class="sr-only"> (required)</span>
    }
  </label>
  <div class="form-field-control relative w-full">
    <ng-content></ng-content>
    @if ($hasValue()) {
      <button
        class="form-field-clear-button text-finance-muted rounded-control absolute top-2 grid size-6 min-h-0 place-items-center p-1 transition-colors hover:bg-rose-500/15 hover:text-rose-300 focus-visible:ring-2 focus-visible:ring-rose-400"
        [attr.aria-label]="'Clear ' + $label()"
        (click)="clearValue()"
        type="button"
      >
        <svg class="size-4" lucideX aria-hidden="true"></svg>
      </button>
    }
  </div>
</div>
