<ng-template #typeCell let-row="row">
  <span
    class="status-badge"
    [class.status-badge-expense]="row.kind === TransactionType.Expense"
    [class.status-badge-income]="row.kind === TransactionType.Income"
    [class.status-badge-refund]="row.kind === TransactionType.Refund"
  >
    {{ row.kind }}
  </span>
</ng-template>

<ng-template #amountCell let-row="row">
  <span
    class="font-semibold tabular-nums"
    [class.text-finance-negative]="row.kind === TransactionType.Expense"
    [class.text-finance-positive]="row.kind === TransactionType.Income"
    [class.text-finance-warning]="row.kind === TransactionType.Refund"
  >
    {{ row.kind === TransactionType.Expense ? '−' : '+' }}{{ row.amount | currency }}
  </span>
</ng-template>

<ng-template #partyCell let-row="row">
  <span
    class="participant-badge"
    [style.--user-color]="row.party.color | userColor"
    [title]="row.party.name"
  >
    <span class="truncate">{{ row.party.name }}</span>
  </span>
</ng-template>

<ng-template #beneficiariesCell let-row="row">
  <div class="flex max-w-64 flex-wrap gap-1.5">
    @for (beneficiary of row.beneficiaries; track beneficiary.id) {
      <span
        class="participant-badge"
        [style.--user-color]="beneficiary.color | userColor"
        [title]="beneficiary.name"
      >
        <span class="truncate">{{ beneficiary.name }}</span>
      </span>
    }
  </div>
</ng-template>

<app-data-table
  [$data]="$rows()"
  [$totalResults]="$totalResults()"
  [$columns]="$columns()"
  [$tableClass]="'min-w-[860px] table-auto lg:table-fixed'"
  [$title]="'Transactions'"
  [$caption]="'Transactions'"
  [$emptyMessage]="'No transactions in this date range.'"
  [$addActionLabel]="'Add transaction'"
  [$canEditRow]="canManageRow"
  [$canDeleteRow]="canManageRow"
  [$striped]="false"
  (addRequested)="addRequested.emit()"
  (editRequested)="editRow($event)"
  (deleteRequested)="deleteRow($event)"
/>
