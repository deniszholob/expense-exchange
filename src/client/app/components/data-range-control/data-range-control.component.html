<div class="relative">
  <app-data-range-trigger
    [$label]="$dataRangeLabel()"
    [$expanded]="$panelOpen()"
    [$panelId]="$panelId()"
    (toggleRequested)="togglePanel()"
  />
  @if ($panelOpen()) {
    <div
      class="absolute top-full left-1/2 z-50 mt-2 w-[min(36rem,calc(100vw-2rem))] -translate-x-1/2"
    >
      <app-data-range-panel
        [($range)]="$dataRange"
        [$earliestDate]="$earliestDate()"
        [$idPrefix]="$idPrefix()"
        [$panelId]="$panelId()"
      />
    </div>
  }
</div>
