<div
  class="flex w-full flex-col gap-4"
  [attr.aria-label]="'Date range: ' + $rangeLabel()"
  role="group"
>
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="text-finance-text flex flex-col gap-2 text-sm font-medium">
      Year
      <select [value]="$yearSelection()" (change)="selectYear($event)">
        <option value="all">All years</option>
        @if ($range().preset === DateRangePreset.Custom) {
          <option value="custom" disabled>Custom dates</option>
        }
        @for (year of $yearOptions(); track year) {
          <option [value]="year">{{ year }}</option>
        }
      </select>
    </label>
    <label class="text-finance-text flex flex-col gap-2 text-sm font-medium">
      Month
      <select [value]="$monthSelection()" (change)="selectMonth($event)">
        <option value="all">All months</option>
        @if ($range().preset === DateRangePreset.Custom) {
          <option value="custom" disabled>Custom dates</option>
        }
        @for (month of $monthOptions; track month.value) {
          <option [value]="month.value">{{ month.label }}</option>
        }
      </select>
    </label>
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <app-form-field
      [$id]="$idPrefix() + '-start'"
      [$label]="'Date paid from'"
      [$value]="$range().startDate"
      (clearRequested)="clearStartDate()"
    >
      <input
        [id]="$idPrefix() + '-start'"
        [value]="$range().startDate"
        (change)="updateStartDate($event)"
        type="date"
      />
    </app-form-field>
    <app-form-field
      [$id]="$idPrefix() + '-end'"
      [$label]="'Date paid through'"
      [$value]="$range().endDate"
      (clearRequested)="clearEndDate()"
    >
      <input
        [id]="$idPrefix() + '-end'"
        [value]="$range().endDate"
        (change)="updateEndDate($event)"
        type="date"
      />
    </app-form-field>
  </div>

  @if (!$rangeValid()) {
    <p class="text-finance-negative text-sm" role="alert">
      The end date must be on or after the start date.
    </p>
  }
</div>
