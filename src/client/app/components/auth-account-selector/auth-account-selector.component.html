@if ($accounts().length > 0) {
  <fieldset class="flex flex-col gap-2">
    <legend class="text-finance-muted mb-1 text-sm">Choose an account</legend>
    @for (account of $accounts(); track account.username) {
      <button
        class="rounded-control border-finance-border bg-finance-canvas/40 hover:border-finance-border-strong hover:bg-finance-raised flex w-full items-center gap-3 border p-3 text-left transition-colors"
        [class.border-sky-400]="
          $selectedUsername() === account.username && account.role !== 'Admin'
        "
        [class.border-violet-400]="
          $selectedUsername() === account.username && account.role === 'Admin'
        "
        [attr.aria-pressed]="$selectedUsername() === account.username"
        (click)="select(account.username)"
        type="button"
      >
        <span
          class="profile-monogram size-9 text-sm"
          [class.profile-monogram-admin]="account.role === 'Admin'"
          aria-hidden="true"
          >{{ account.username.slice(0, 1).toUpperCase() }}</span
        >
        <span class="min-w-0 flex-1 truncate font-medium">{{ account.username }}</span>
        <span class="text-finance-muted text-xs">{{ account.role }}</span>
      </button>
    }
  </fieldset>
}
