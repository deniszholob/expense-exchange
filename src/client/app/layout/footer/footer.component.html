<footer class="app-footer-shell shrink-0 border-t">
  <div class="container-fluid gap-0 py-1">
    <div class="app-footer-inner section-container">
      <div class="flex items-center gap-2">
        <span
          class="app-footer-brand-mark group"
          tabindex="0"
          aria-label="Expense Exchange"
          aria-describedby="app-name-tooltip"
        >
          <img
            class="size-6 object-contain"
            src="assets/expense-exchange-icon.png"
            width="16"
            height="16"
            alt=""
            aria-hidden="true"
          />
          <span
            class="rounded-control border-finance-border bg-finance-raised text-finance-text pointer-events-none invisible absolute bottom-full left-0 z-50 mb-2 w-max border px-2.5 py-1.5 text-xs opacity-0 shadow-lg transition-opacity group-hover:visible group-hover:opacity-100 group-focus-visible:visible group-focus-visible:opacity-100"
            id="app-name-tooltip"
            role="tooltip"
            >Expense Exchange</span
          >
        </span>
        <p class="text-finance-muted text-xs">
          Made by
          <a class="link" target="_blank" rel="noopener noreferrer" href="https://deniszholob.com/"
            >deniszholob.com</a
          >
        </p>
      </div>

      <div class="flex items-center gap-1">
        <span class="text-finance-muted hidden text-xs sm:inline-flex">Donate</span>
        <a
          class="link group relative inline-flex size-6 items-center justify-center"
          href="https://ko-fi.com/deniszholob"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Donate on Ko-fi"
          aria-describedby="footer-kofi-tooltip"
        >
          <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M4 6h13v8.5A4.5 4.5 0 0 1 12.5 19h-4A4.5 4.5 0 0 1 4 14.5V6Z"></path>
            <path d="M17 8h1.5a3.5 3.5 0 0 1 0 7H17v-2h1.5a1.5 1.5 0 0 0 0-3H17V8Z"></path>
          </svg>
          <span
            class="rounded-control border-finance-border bg-finance-raised text-finance-text pointer-events-none invisible absolute bottom-full left-1/2 z-50 mb-2 w-max -translate-x-1/2 border px-2.5 py-1.5 text-xs opacity-0 shadow-lg transition-opacity group-hover:visible group-hover:opacity-100 group-focus-visible:visible group-focus-visible:opacity-100"
            id="footer-kofi-tooltip"
            role="tooltip"
            >Donate on Ko-fi</span
          >
        </a>
        <a
          class="link group relative inline-flex size-6 items-center justify-center"
          href="https://www.patreon.com/deniszholob"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Support on Patreon"
          aria-describedby="footer-patreon-tooltip"
        >
          <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M16.1 2C8.6 2 4 7.4 4 15.1c0 4.6 1.5 6.9 4.3 6.9 3.4 0 3.6-4.8 5.4-7.2 2-2.6 5.8-2.8 8.1-5 1.5-1.4 2.2-3 2.2-4.7C24 4.2 20.6 2 16.1 2Z"
            ></path>
          </svg>
          <span
            class="rounded-control border-finance-border bg-finance-raised text-finance-text pointer-events-none invisible absolute bottom-full left-1/2 z-50 mb-2 w-max -translate-x-1/2 border px-2.5 py-1.5 text-xs opacity-0 shadow-lg transition-opacity group-hover:visible group-hover:opacity-100 group-focus-visible:visible group-focus-visible:opacity-100"
            id="footer-patreon-tooltip"
            role="tooltip"
            >Support on Patreon</span
          >
        </a>
      </div>

      <div class="flex items-center gap-4">
        <div class="flex items-center gap-1">
          <span class="text-finance-muted hidden text-xs sm:inline-flex">Connect</span>
          <a
            class="link group relative inline-flex size-6 items-center justify-center"
            href="https://discord.gg/PkyzXzz"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Discord Discussion"
            aria-describedby="footer-discord-tooltip"
          >
            <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M19.5 5.4a17.8 17.8 0 0 0-4.4-1.4l-.6 1.2a15.8 15.8 0 0 0-5 0l-.6-1.2a17.8 17.8 0 0 0-4.4 1.4C1.7 9.2 1 12.9 1.4 16.6a18.3 18.3 0 0 0 5.5 2.8l1.2-2.1c-.7-.3-1.4-.6-2-1 3.9 1.8 8.1 1.8 12 0-.6.4-1.3.7-2 1l1.2 2.1a18.2 18.2 0 0 0 5.5-2.8c.5-4.3-.7-8-3.3-11.2Z"
              ></path>
              <circle cx="9" cy="12.5" r="1.25" fill="var(--color-finance-chrome)"></circle>
              <circle cx="15" cy="12.5" r="1.25" fill="var(--color-finance-chrome)"></circle>
            </svg>
            <span
              class="rounded-control border-finance-border bg-finance-raised text-finance-text pointer-events-none invisible absolute right-0 bottom-full z-50 mb-2 w-max border px-2.5 py-1.5 text-xs opacity-0 shadow-lg transition-opacity group-hover:visible group-hover:opacity-100 group-focus-visible:visible group-focus-visible:opacity-100"
              id="footer-discord-tooltip"
              role="tooltip"
              >Discord Discussion</span
            >
          </a>
          <a
            class="link group relative inline-flex size-6 items-center justify-center"
            href="https://github.com/deniszholob/expense-exchange"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub Codebase"
            aria-describedby="footer-github-tooltip"
          >
            <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M12 .3C5.37.3 0 5.67 0 12.3c0 5.3 3.44 9.8 8.2 11.38.6.12.82-.25.82-.57v-2.04c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.49 1 .11-.78.42-1.31.76-1.61-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.62-5.48 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.22.69.83.57A12.02 12.02 0 0 0 24 12.3C24 5.67 18.63.3 12 .3Z"
              ></path>
            </svg>
            <span
              class="rounded-control border-finance-border bg-finance-raised text-finance-text pointer-events-none invisible absolute right-0 bottom-full z-50 mb-2 w-max border px-2.5 py-1.5 text-xs opacity-0 shadow-lg transition-opacity group-hover:visible group-hover:opacity-100 group-focus-visible:visible group-focus-visible:opacity-100"
              id="footer-github-tooltip"
              role="tooltip"
              >GitHub Codebase</span
            >
          </a>
        </div>
        <span class="app-footer-version group" tabindex="0" aria-describedby="app-build-tooltip">
          v{{ APP_BUILD_VERSION }}
          <span
            class="rounded-control border-finance-border bg-finance-raised text-finance-text pointer-events-none invisible absolute right-0 bottom-full z-50 mb-2 w-max max-w-[calc(100vw-2rem)] border px-3 py-2 text-left text-xs opacity-0 shadow-xl transition-opacity group-hover:visible group-hover:opacity-100 group-focus-visible:visible group-focus-visible:opacity-100"
            id="app-build-tooltip"
            role="tooltip"
          >
            <span class="block">Version {{ APP_BUILD_VERSION }}</span>
            <span class="block whitespace-nowrap"
              >Build date: {{ APP_BUILD_DATE | date: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'" : 'UTC' }}</span
            >
          </span>
        </span>
      </div>
    </div>
  </div>
</footer>
